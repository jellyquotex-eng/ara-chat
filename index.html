<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 Months Countdown</title>
<meta name="theme-color" content="#f6f4ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Hind+Siliguri:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ec;
    --ink: #2b3123;
    --muted: #6c7360;
    --olive: #6b7a3a;
    --olive-deep: #4d5a26;
    --blue: #a9c4dc;
    --blue-soft: #dbe7f1;
    --card: rgba(255, 255, 255, .55);
    --card-border: rgba(255, 255, 255, .85);
    --shadow: 0 18px 50px -18px rgba(77, 90, 38, .28), 0 2px 8px rgba(77, 90, 38, .06);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bn: "Hind Siliguri", "Noto Sans Bengali", "Kohinoor Bangla", "Nirmala UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(900px 600px at 12% 8%, var(--blue-soft), transparent 60%),
      radial-gradient(800px 600px at 92% 95%, #e4e9cf, transparent 60%),
      var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background particles */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bg span {
    position: absolute; bottom: -40px; border-radius: 50%;
    background: var(--olive); opacity: 0;
    animation: float linear infinite; will-change: transform, opacity;
  }
  .bg span.blue { background: var(--blue); }
  @keyframes float {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    15%  { opacity: .22; }
    85%  { opacity: .16; }
    100% { transform: translate3d(var(--dx, 20px), -112vh, 0); opacity: 0; }
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 920px; }
  .stage { position: relative; display: grid; }
  .view { grid-area: 1 / 1; transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease; }

  /* Countdown view */
  .countdown { text-align: center; animation: enter 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  h1 {
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(1.9rem, 5.5vw, 3.4rem); line-height: 1.12;
    letter-spacing: -.01em; color: var(--olive-deep);
  }
  .sub { margin: 14px auto 0; max-width: 34ch; color: var(--muted); font-size: clamp(.95rem, 2.4vw, 1.05rem); line-height: 1.6; }

  .grid {
    margin: clamp(28px, 6vw, 52px) auto 0;
    display: grid; gap: clamp(10px, 2vw, 18px);
    grid-template-columns: repeat(5, 1fr);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: clamp(14px, 3.2vw, 30px) 6px clamp(12px, 2.6vw, 24px);
    animation: enter .9s cubic-bezier(.2, .7, .2, 1) both;
  }
  .card:nth-child(1) { animation-delay: .15s; }
  .card:nth-child(2) { animation-delay: .25s; }
  .card:nth-child(3) { animation-delay: .35s; }
  .card:nth-child(4) { animation-delay: .45s; }
  .card:nth-child(5) { animation-delay: .55s; border-color: rgba(169, 196, 220, .9); }
  .num {
    display: block; font-family: var(--serif); font-weight: 500;
    font-size: clamp(1.6rem, 7.2vw, 4rem); line-height: 1;
    color: var(--olive-deep); font-variant-numeric: tabular-nums;
  }
  .num.tick { animation: tick .45s ease; }
  @keyframes tick {
    0% { transform: translateY(-.25em); opacity: .15; }
    100% { transform: none; opacity: 1; }
  }
  .label { display: block; margin-top: clamp(8px, 1.6vw, 14px); font-size: clamp(.58rem, 2.1vw, .82rem); color: var(--muted); letter-spacing: .04em; }
  .until { margin-top: clamp(22px, 4vw, 34px); font-size: .9rem; color: var(--muted); }

  /* Completion view */
  .done {
    text-align: center; opacity: 0; visibility: hidden;
    transform: translateY(24px) scale(.98); filter: blur(6px);
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 32px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    padding: clamp(36px, 8vw, 84px) clamp(20px, 6vw, 64px);
  }
  body.complete .countdown { opacity: 0; transform: translateY(-16px) scale(.98); filter: blur(6px); pointer-events: none; animation: none; }
  body.complete .done { opacity: 1; visibility: visible; transform: none; filter: none; transition-delay: .9s; }
  .done h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 7vw, 4rem); color: var(--olive-deep); letter-spacing: -.01em; }
  .heart { display: inline-block; animation: beat 2.4s ease-in-out infinite; }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1.04); } 45% { transform: scale(1.12); } }
  .rule { width: 56px; height: 2px; margin: clamp(20px, 4vw, 32px) auto; background: linear-gradient(90deg, var(--olive), var(--blue)); border-radius: 2px; }
  .bn { font-family: var(--bn); font-size: clamp(1.25rem, 4.6vw, 2rem); line-height: 1.7; color: var(--ink); }
  .en { margin-top: clamp(16px, 3vw, 26px); color: var(--muted); font-size: clamp(.85rem, 2.4vw, .98rem); }
  .done .reveal { opacity: 0; transform: translateY(14px); }
  body.complete .done .reveal { animation: enter 1s cubic-bezier(.2, .7, .2, 1) forwards; }
  body.complete .done h2.reveal { animation-delay: 1.2s; }
  body.complete .done .rule.reveal { animation-delay: 1.7s; }
  body.complete .done .bn.reveal { animation-delay: 2.1s; }
  body.complete .done .en.reveal { animation-delay: 2.7s; }

  .note { margin-top: clamp(18px, 3.5vw, 28px); font-family: var(--bn); font-size: clamp(1.15rem, 4.2vw, 1.6rem); line-height: 1.6; color: var(--olive-deep); }

  .sound-btn {
    position: fixed; z-index: 2;
    right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 .85rem var(--sans); color: var(--olive-deep);
    background: var(--card); border: 1px solid var(--card-border); border-radius: 999px;
    box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 10px 16px; cursor: pointer; transition: transform .2s ease, background .2s ease;
  }
  .sound-btn:hover { background: rgba(255, 255, 255, .8); }
  .sound-btn:active { transform: scale(.96); }
  .sound-btn:focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; }
  .sound-btn[aria-pressed="true"] { background: var(--olive); color: #fff; border-color: var(--olive); }

  @media (max-width: 420px) { .card { border-radius: 16px; padding-left: 2px; padding-right: 2px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .bg { display: none; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>

  <main>
    <div class="stage">
      <section class="view countdown" id="countdown" aria-live="off">
        <h1>Five months, counted down</h1>
        <p class="sub">Every second brings the day a little closer.</p>

        <div class="grid" role="timer" aria-label="Time remaining">
          <div class="card"><span class="num" id="months">05</span><span class="label">Months</span></div>
          <div class="card"><span class="num" id="days">00</span><span class="label">Days</span></div>
          <div class="card"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
          <div class="card"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
          <div class="card"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>

        <p class="until" id="until"></p>
        <p class="note">ওই দিন তোমাকে দেখব, আআআআআআআ <span class="heart">❤️</span></p>
      </section>

      <section class="view done" id="done" aria-live="polite">
        <h2 class="reveal">5 Months Complete <span class="heart">❤️</span></h2>
        <div class="rule reveal"></div>
        <p class="bn reveal">তোমার ৫ মাস পূর্ণ হয়ে গেছে।<br>আমি তোমাকে আজকে দেখতে পারব। <span class="heart">❤️</span></p>
        <p class="en reveal">The 5-month countdown is complete.</p>
      </section>
    </div>
  </main>

  <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false">
    <span aria-hidden="true" id="soundIcon">🔇</span><span id="soundText">Sound off</span>
  </button>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'fiveMonthCountdown.v1';
  var MONTHS = 5;

  /* DEVELOPER TESTING ONLY.
     Set to true to expose window.resetCountdown() in the browser console.
     Keep false for production; there is intentionally no reset button in the UI. */
  var ENABLE_DEV_RESET = false;

  /* ---------- Date helpers ---------- */

  // Adds calendar months, keeping the same day and time.
  // If the day doesn't exist in the target month (e.g. 31 Jan + 1), clamps to that month's last day.
  function addMonths(date, n) {
    var d = new Date(date.getTime());
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }

  // Breaks the gap between now and target into calendar months + days/hours/min/sec.
  function remaining(now, target) {
    if (now >= target) return { months: 0, days: 0, hours: 0, minutes: 0, seconds: 0, done: true };
    var months = 0;
    while (addMonths(now, months + 1) <= target) months++;
    var rest = target.getTime() - addMonths(now, months).getTime();
    var s = Math.floor(rest / 1000);
    return {
      months: months,
      days: Math.floor(s / 86400),
      hours: Math.floor((s % 86400) / 3600),
      minutes: Math.floor((s % 3600) / 60),
      seconds: s % 60,
      done: false
    };
  }

  /* ---------- Persistence ---------- */

  var memoryFallback = null; // only used if localStorage is blocked

  function isValidTs(v) { return typeof v === 'number' && isFinite(v) && v > 0; }

  function loadSaved() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (data && isValidTs(data.startTimestamp) && isValidTs(data.targetTimestamp) &&
          data.targetTimestamp > data.startTimestamp) return data;
    } catch (e) { /* unavailable or corrupted: treated as missing */ }
    return null;
  }

  function getTarget() {
    var saved = loadSaved();
    if (saved) return saved.targetTimestamp;       // never overwrite an existing target
    if (memoryFallback) return memoryFallback.targetTimestamp;

    var start = new Date();
    var data = {
      startTimestamp: start.getTime(),
      targetTimestamp: addMonths(start, MONTHS).getTime()
    };
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      memoryFallback = data; // keeps this session consistent if storage is blocked
    }
    return data.targetTimestamp;
  }

  if (ENABLE_DEV_RESET) {
    window.resetCountdown = function () {
      try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      location.reload();
    };
  }

  /* ---------- UI ---------- */

  var els = {
    months: document.getElementById('months'),
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds')
  };
  var last = {};

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function setValue(key, value) {
    var text = pad(Math.max(0, value));
    if (last[key] === text) return;
    var el = els[key];
    el.textContent = text;
    if (last[key] !== undefined) {
      el.classList.remove('tick');
      void el.offsetWidth; // restart animation
      el.classList.add('tick');
    }
    last[key] = text;
  }

  function render(r) {
    setValue('months', r.months);
    setValue('days', r.days);
    setValue('hours', r.hours);
    setValue('minutes', r.minutes);
    setValue('seconds', r.seconds);
  }

  /* ---------- Sound (Web Audio, no audio files needed) ----------
     Browsers only allow audio after a tap, so sound starts off and the
     person turns it on with the button. */

  var audio = { ctx: null, on: false };

  function ensureCtx() {
    if (!audio.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio.ctx = new AC();
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return audio.ctx;
  }

  function tone(freq, start, dur, vol, type) {
    var c = audio.ctx;
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(start);
    o.stop(start + dur + 0.05);
  }

  // Soft tick every second, a gentle bell each full minute, brighter ticks in the final 10 seconds.
  function playTick(r) {
    if (!audio.on || !audio.ctx || document.hidden) return;
    var t = audio.ctx.currentTime;
    if (r.seconds === 0) {
      tone(660, t, 1.1, 0.06);
      tone(990, t, 1.1, 0.025);
    } else if (r.months === 0 && r.days === 0 && r.hours === 0 && r.minutes === 0 && r.seconds <= 10) {
      tone(1400, t, 0.12, 0.07, 'triangle');
    } else {
      tone(900, t, 0.08, 0.04, 'triangle');
    }
  }

  // Warm rising chime when the countdown completes.
  function playChime() {
    if (!audio.on || !audio.ctx) return;
    var t = audio.ctx.currentTime + 0.05;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      tone(f, t + i * 0.38, 2.4, 0.08);
      tone(f * 2, t + i * 0.38, 1.6, 0.02);
    });
  }

  var soundBtn = document.getElementById('soundBtn');
  function updateSoundBtn() {
    soundBtn.setAttribute('aria-pressed', audio.on ? 'true' : 'false');
    document.getElementById('soundIcon').textContent = audio.on ? '🔊' : '🔇';
    document.getElementById('soundText').textContent = audio.on ? 'Sound on' : 'Sound off';
  }
  soundBtn.addEventListener('click', function () {
    if (!audio.on) {
      if (!ensureCtx()) return;
      audio.on = true;
      var t = audio.ctx.currentTime;
      tone(784, t, 0.35, 0.06);
      tone(1046.5, t + 0.12, 0.5, 0.05);
    } else {
      audio.on = false;
    }
    updateSoundBtn();
  });

  var timer = null;

  function finish() {
    if (timer) { clearInterval(timer); timer = null; }
    render({ months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 });
    document.body.classList.add('complete');
    playChime();
    document.getElementById('countdown').setAttribute('aria-hidden', 'true');
  }

  function init() {
    var target = new Date(getTarget());

    document.getElementById('until').textContent = 'Until ' + target.toLocaleString(undefined, {
      day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit'
    });

    function tick() {
      var r = remaining(new Date(), target);
      if (r.done) { finish(); return; }
      render(r);
      playTick(r);
    }

    tick();
    if (!document.body.classList.contains('complete')) {
      timer = setInterval(tick, 1000);
      // Re-sync immediately when the tab becomes visible again (timers can be throttled in background).
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && timer) tick();
      });
    }
  }

  /* ---------- Background particles ---------- */

  function buildParticles() {
    var bg = document.getElementById('bg');
    var count = window.innerWidth < 640 ? 10 : 18;
    for (var i = 0; i < count; i++) {
      var s = document.createElement('span');
      var size = 6 + Math.random() * 22;
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = 22 + Math.random() * 26 + 's';
      s.style.animationDelay = -Math.random() * 40 + 's';
      s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      if (i % 3 === 0) s.className = 'blue';
      bg.appendChild(s);
    }
  }

  buildParticles();
  init();
})();
</script>
</body>
</html>
