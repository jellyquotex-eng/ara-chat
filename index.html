<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>Hiloo Sister 👀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ CSS VARIABLES ============ */
:root{
  --cream:#fbf6ec; --olive:#b9c79a; --olive-d:#8fa66b; --baby:#bfe0f5; --baby-d:#8cc4e6;
  --ink:#3f4a2f; --ease:cubic-bezier(.2,.85,.25,1);
  --w:min(84vw, calc(58vh * .8), 440px);
  --font:'Fredoka', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font); color:var(--ink); -webkit-tap-highlight-color:transparent;
  background:linear-gradient(160deg,#fbf6ec 0%,#f2f5e4 48%,#e6f2fa 100%);
}

/* ============ BACKGROUND DECOR ============ */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;will-change:transform}
.b1{width:48vmax;height:48vmax;left:-14vmax;top:-12vmax;background:#cfe0b0;animation:drift 16s ease-in-out infinite alternate}
.b2{width:52vmax;height:52vmax;right:-18vmax;bottom:-16vmax;background:var(--baby);animation:drift 20s ease-in-out -6s infinite alternate}
.b3{width:28vmax;height:28vmax;left:42%;top:28%;background:#f6e9c9;opacity:.5;animation:drift 24s ease-in-out -12s infinite alternate}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
body.calm .blob{animation-play-state:paused}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* ============ INTRO ANIMATION ============ */
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px}
#intro.out{animation:introOut .85s cubic-bezier(.6,0,.4,1) forwards;pointer-events:none}
@keyframes introOut{to{opacity:0;transform:scale(1.3);filter:blur(20px)}}
.card{
  text-align:center; padding:clamp(28px,6vw,56px) clamp(24px,7vw,64px); border-radius:36px;
  background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.75);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(143,166,107,.22), 0 4px 14px rgba(140,196,230,.18), inset 0 1px 0 rgba(255,255,255,.8);
  max-width:92vw;
}
.line{opacity:0;animation:cine 1.4s var(--ease) forwards}
.line span{display:inline-block;animation:bob 4.2s ease-in-out infinite}
.l1{font-size:clamp(2.1rem,9.5vw,4.2rem);font-weight:700;line-height:1.1;animation-delay:.3s}
.l2{font-size:clamp(1.5rem,6.5vw,2.6rem);font-weight:500;margin-top:.5em;animation-delay:1.5s}
.l3{font-size:clamp(1rem,4vw,1.3rem);margin-top:1.6em;opacity:0;color:#6b7757;animation-delay:2.7s}
.l2 span{animation-delay:-1.2s}
@keyframes cine{
  0%{opacity:0;transform:translateY(26px) scale(.84);filter:blur(18px)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
@keyframes bob{50%{transform:translateY(-7px)}}
#go{
  margin-top:.9em;font:600 clamp(1.05rem,4.4vw,1.35rem)/1 var(--font);color:#2f3a22;cursor:pointer;
  padding:1em 2.1em;border:0;border-radius:999px;
  background:linear-gradient(135deg,#bdd09a 0%,#a8d4ee 100%);
  box-shadow:0 10px 28px rgba(143,166,107,.4), inset 0 1px 0 rgba(255,255,255,.7);
  opacity:0;animation:cine 1.2s var(--ease) 3.3s forwards, glow 2.4s ease-in-out 4.5s infinite;
  transition:transform .25s var(--ease);
}
#go:hover{transform:translateY(-2px) scale(1.05)}
#go:active{transform:scale(.95)}
#go:focus-visible{outline:3px solid var(--baby-d);outline-offset:4px}
#go:disabled{pointer-events:none}
@keyframes glow{
  0%,100%{box-shadow:0 10px 28px rgba(143,166,107,.4),0 0 0 0 rgba(140,196,230,.55)}
  50%{box-shadow:0 12px 34px rgba(143,166,107,.5),0 0 0 16px rgba(140,196,230,0)}
}

/* ============ MAIN ANIMATION ============ */
#main{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;visibility:hidden}
#main.in{visibility:visible}
#main.in #stage{animation:enter 1.1s var(--ease) backwards}
@keyframes enter{from{opacity:0;transform:scale(.78) translateY(34px);filter:blur(16px)}}
#stage{display:grid;justify-items:center}
#montage,#final,#final2{grid-area:1/1;align-self:center}
.frame{
  width:var(--w);padding:clamp(6px,1.6vw,10px);border-radius:32px;will-change:transform;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 22px 60px rgba(143,166,107,.32),0 0 46px rgba(140,196,230,.4);
}
.pic{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:var(--cream)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.pic img.on{opacity:1}
.pic .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.pic .scan{position:absolute;left:0;right:0;top:0;height:7%;background:linear-gradient(90deg,rgba(191,224,245,.0),rgba(191,224,245,.75),rgba(185,199,154,0));opacity:0;pointer-events:none}
.bar{height:4px;border-radius:4px;background:rgba(143,166,107,.2);margin:9px 6px 3px;overflow:hidden}
.bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--olive-d),var(--baby-d))}

/* ============ FINAL REVEAL ============ */
#flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#fff9e8 55%,#e3f2fb 100%)}
#flash.pop{animation:flashA .95s ease-out}
@keyframes flashA{0%{opacity:0}14%{opacity:.95}100%{opacity:0}}
#final,#final2{display:none;position:relative;padding:8px;border-radius:36px;background:rgba(255,255,255,.65);
  box-shadow:0 22px 60px rgba(143,166,107,.35),0 0 60px 8px rgba(140,196,230,.5)}
#final::before,#final2::before{content:"";position:absolute;inset:-16px;border-radius:50px;z-index:-1;filter:blur(18px);opacity:.75;
  background:conic-gradient(from 0deg,var(--baby),var(--olive),#fff3d6,var(--baby))}
#final img,#final2 img{display:block;width:auto;height:auto;max-width:min(86vw,460px);max-height:max(160px,min(50vh,calc(100vh - 300px)));border-radius:28px}
#final.go,#final2.go{display:block;animation:reveal 1.7s var(--ease) backwards,gl 2.4s ease-in-out 1.7s 3}
#final.go::before,#final2.go::before{animation:ring 2.4s ease-in-out 1.7s 3}
@keyframes reveal{
  0%{opacity:0;transform:scale(.05) rotate(-26deg);filter:blur(28px) brightness(1.7)}
  40%{opacity:1}
  70%{transform:scale(1.09) rotate(5deg);filter:blur(2px) brightness(1.1)}
  100%{transform:none;filter:blur(0) brightness(1)}
}
@keyframes gl{50%{box-shadow:0 26px 70px rgba(143,166,107,.45),0 0 90px 18px rgba(140,196,230,.65)}}
@keyframes ring{50%{opacity:1;transform:scale(1.04)}}

/* ============ NOTIFICATIONS (iPhone / Instagram style) ============ */
#main{transition:padding-top .8s var(--ease)}
#main.n1{padding-top:112px}#main.n2{padding-top:196px}#main.n3{padding-top:280px}
#final.out{animation:picOut .6s cubic-bezier(.6,0,.8,.4) forwards}
@keyframes picOut{to{opacity:0;transform:scale(.5) rotate(16deg) translateY(40px);filter:blur(14px)}}
#notifs{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));width:min(92vw,420px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:22px;color:#000;
  font:400 15px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Roboto,system-ui,sans-serif;
  background:rgba(245,245,247,.82);border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 10px 32px rgba(0,0,0,.16);animation:ntIn .65s cubic-bezier(.2,.9,.3,1.1) backwards,wig .5s ease-in-out .65s}
.ig{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.ig svg{width:24px;height:24px}
.tx{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;gap:8px}.hd b{font-weight:600}
.hd span{font-size:13px;color:rgba(60,60,67,.6)}
.tx p{overflow-wrap:anywhere}
@keyframes ntIn{0%{opacity:0;transform:translateY(-140%) scale(.94)}55%{opacity:1;transform:translateY(7%) scale(1.01)}100%{transform:none}}
@keyframes wig{25%{transform:rotate(-1.8deg) scale(1.02)}55%{transform:rotate(1.5deg)}80%{transform:rotate(-.7deg)}}

/* ============ INSTAGRAM CHAT ============ */
#chat{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;visibility:hidden;opacity:0;transform-origin:50% 6%;
  background:linear-gradient(160deg,#fbf6ec,#e6f2fa);color:#000;
  font:400 15px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#chat.open{visibility:visible;opacity:1;animation:chatIn .8s var(--ease) backwards}
@keyframes chatIn{from{opacity:0;transform:scale(.25);filter:blur(10px)}}
.app{width:min(100vw,460px);height:100%;background:#fff;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){#chat{align-items:center}.app{height:min(94vh,860px);border-radius:34px;box-shadow:0 30px 80px rgba(143,166,107,.3)}}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #efefef}
.ic{width:26px;height:26px;flex:none;fill:none;stroke:#000;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ring2{position:relative;flex:none;padding:2px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.av{width:34px;height:34px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-weight:600;background:linear-gradient(135deg,#bdd09a,#8cc4e6)}
.big .av{width:80px;height:80px;font-size:32px;border-width:3px}
.top .ring2::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#2ecc5a;border:2px solid #fff}
.who{flex:1;line-height:1.2}.who b{display:block;font-weight:600;font-size:16px}.who span{font-size:12px;color:#737373}
.thread{flex:1;padding:14px 14px 8px;overflow:hidden;display:flex;flex-direction:column}
.intro{display:grid;justify-items:center;gap:3px;padding:18px 0 22px}
.intro b{font-size:18px;font-weight:600;margin-top:8px}.intro span{color:#737373;font-size:14px}
.intro i{font-style:normal;font-weight:600;font-size:14px;background:#efefef;padding:7px 16px;border-radius:10px;margin-top:10px}
.stamp{text-align:center;color:#737373;font-size:12px;margin-bottom:12px}
#msgs{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.m{max-width:75%;padding:10px 15px;border-radius:22px;color:#fff;overflow-wrap:anywhere;transform-origin:100% 100%;
  background:linear-gradient(135deg,#7a5cff,#3797f0);animation:bub .5s cubic-bezier(.2,1.3,.4,1) backwards}
.m:not(:last-child){border-bottom-right-radius:6px}.m+.m{border-top-right-radius:6px}
@keyframes bub{from{opacity:0;transform:translateY(16px) scale(.6)}}
#status{text-align:right;color:#737373;font-size:12px;margin-top:4px;min-height:16px;opacity:0;transition:opacity .3s}
#status.on{opacity:1}
.cmp{display:flex;align-items:center;gap:10px;margin:8px 12px calc(12px + env(safe-area-inset-bottom));padding:5px 14px 5px 5px;border-radius:26px;background:#efefef}
.cam{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7a5cff,#3797f0)}
.cam svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#inp{flex:1;min-height:20px;overflow-wrap:anywhere}
#inp:empty::before{content:"Message...";color:#737373}
.cmp.typing #inp::after{content:"";display:inline-block;width:1.5px;height:17px;margin-left:1px;vertical-align:-3px;background:#3797f0;animation:blink .8s steps(1) infinite}
.icos{display:flex;gap:12px}.icos .ic{width:24px;height:24px}
#snd{display:none;color:#3797f0;font-weight:600}
.cmp.typing .icos{display:none}.cmp.typing #snd{display:block}
@keyframes blink{50%{opacity:0}}

/* ============ RESPONSIVE DESIGN ============ */
@media (max-height:520px){:root{--w:min(60vw, calc(60vh * .8), 440px)}#final img{max-height:50vh}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>
<body>

<!-- ============ HTML STRUCTURE ============ -->
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<canvas id="fx"></canvas>

<section id="intro">
  <div class="card">
    <h1 class="line l1"><span>Hiloo Sister 👀</span></h1>
    <h2 class="line l2"><span>This is Fy 😭</span></h2>
    <p class="l3 line">Niche click koro 👀</p>
    <button id="go" type="button">Click Koro 💗</button>
  </div>
</section>

<main id="main">
  <div id="stage">
    <div id="montage" class="frame">
      <div class="pic" id="pic">
        <img src="https://cdn.corenexis.com/f/WLV5y15b.png" alt="" decoding="async" referrerpolicy="no-referrer">
        <img src="https://cdn.corenexis.com/f/3LdioqYq.png" alt="" decoding="async" referrerpolicy="no-referrer">
        <img src="https://cdn.corenexis.com/f/XeGHFYB3.png" alt="" decoding="async" referrerpolicy="no-referrer">
        <img src="https://cdn.corenexis.com/f/cQZXosIk.png" alt="" decoding="async" referrerpolicy="no-referrer">
        <div class="fl" id="fl"></div><div class="scan" id="scan"></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div id="final"><img id="mainImg" src="https://cdn.corenexis.com/f/eed0GBX2.webp" alt="Surprise!" decoding="async" referrerpolicy="no-referrer"></div>
    <div id="final2"><img id="img2" src="https://cdn.corenexis.com/f/JfPtHkqQ.jpg" alt="Surprise 2" decoding="async" referrerpolicy="no-referrer"></div>
  </div>
</main>
<section id="chat" aria-label="Instagram chat with ARA">
  <div class="app">
    <header class="top">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      <div class="ring2"><div class="av">A</div></div>
      <div class="who"><b>ARA</b><span>Active now</span></div>
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>
    </header>
    <div class="thread">
      <div class="intro"><div class="ring2 big"><div class="av">A</div></div><b>ARA</b><span>ARA · Instagram</span><i>View profile</i></div>
      <div class="stamp" id="stamp"></div>
      <div id="msgs"></div><div id="status"></div>
    </div>
    <div class="cmp" id="cmp">
      <i class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></i>
      <div id="inp"></div><span id="snd">Send</span>
      <span class="icos">
        <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 10h.01M15 10h.01"/></svg>
      </span>
    </div>
  </div>
</section>
<div id="notifs"></div>
<div id="flash"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const CYCLES = 100, DELAY = 10, IMGS = 4, TOTAL = CYCLES * IMGS;

/* ============ IMAGE PRELOADING ============ */
// The same <img> elements live in the DOM the whole time: no re-downloads, no new nodes.
const imgs = [...document.querySelectorAll('#pic img')], mainImg = $('mainImg');
const dec = i => (i.decode ? i.decode() : Promise.resolve()).catch(() => {});
const ready = Promise.race([Promise.all([...imgs, mainImg, $('img2')].map(dec)), wait(12000)]);

/* ============ PARTICLES (single canvas) ============ */
const cv = $('fx'), c2 = cv.getContext('2d');
const COL = ['#b9c79a', '#9fd0ec', '#fff7e0', '#d4e2b6', '#cfe8f8', '#ffffff'];
let W, H, P = [], ambient = true, fxRaf = 0;
function size() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; c2.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', size); size();
const rnd = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < 26; i++) P.push({a: 1, x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 4), vy: rnd(.15, .45), ph: rnd(0, 6), s: Math.random() < .4, al: rnd(.4, .9), col: COL[i % 6]});
function star(x, y, r) {
  c2.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, d = i % 2 ? r * .35 : r; c2.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  c2.closePath(); c2.fill();
}
function burst(x, y, n, em) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), v = rnd(2, 8);
    P.push({a: 0, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, r: rnd(3, 7), life: rnd(60, 110), age: 0, rot: rnd(0, 6), vr: rnd(-.2, .2), s: Math.random() < .45, col: COL[(Math.random() * 6) | 0], al: 1, e: em && em[(Math.random() * em.length) | 0]});
  }
  kick();
}
function loop() {
  c2.clearRect(0, 0, W, H);
  P = P.filter(p => {
    if (p.a) { // ambient floaters
      p.y -= p.vy; p.ph += .02; p.x += Math.sin(p.ph) * .3;
      if (p.y < -10) { p.y = H + 10; p.x = rnd(0, W); }
      if (!ambient) p.al -= .02;
      if (p.al <= 0) return false;
      c2.globalAlpha = p.al * (.6 + .4 * Math.sin(p.ph * 2)); c2.fillStyle = p.col;
      p.s ? star(p.x, p.y, p.r * 2) : (c2.beginPath(), c2.arc(p.x, p.y, p.r, 0, 6.283), c2.fill());
      return true;
    }
    p.age++; p.vx *= .97; p.vy = p.vy * .97 + .08; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.age > p.life) return false;
    c2.globalAlpha = 1 - p.age / p.life; c2.fillStyle = p.col;
    if (p.e) { c2.font = '22px serif'; c2.textAlign = 'center'; c2.fillText(p.e, p.x, p.y); }
    else if (p.s) star(p.x, p.y, p.r * 1.6);
    else { c2.save(); c2.translate(p.x, p.y); c2.rotate(p.rot); c2.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); c2.restore(); }
    return true;
  });
  c2.globalAlpha = 1;
  fxRaf = P.length ? requestAnimationFrame(loop) : 0; // loop stops itself when nothing is left
}
function kick() { if (!fxRaf) fxRaf = requestAnimationFrame(loop); }
kick();

/* ============ AUDIO SYSTEM (Web Audio, unlocked by the click) ============ */
let AC, out;
function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
    const comp = AC.createDynamicsCompressor(), g = AC.createGain(); g.gain.value = .95;
    lp.connect(comp); comp.connect(g); g.connect(AC.destination); out = lp;
    AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, t, d, type, v, f2) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .02);
}
const NOTES = [523, 659, 784, 1047];
const sfx = {
  blip(i) { if (AC) { const f = NOTES[i] * rnd(.99, 1.02); tone(f, AC.currentTime, .035, 'square', .2, f * 1.25); } },
  whoosh() { if (AC) tone(220, AC.currentTime, .6, 'sine', .35, 1400); },
  boom() {
    if (!AC) return; const t = AC.currentTime;
    tone(190, t, .7, 'sine', .8, 35); tone(1300, t, .35, 'triangle', .3, 300);
    [784, 988, 1175, 1568].forEach((f, k) => tone(f, t + .14 + k * .07, .3, 'triangle', .2));
  },
  send() { if (AC) tone(620, AC.currentTime, .09, 'sine', .28, 1000); },
  notif() { // iPhone-style three-note chime
    if (!AC) return; const t = AC.currentTime;
    [[1319, 0], [1568, .11], [2093, .22]].forEach(([f, d]) => { tone(f, t + d, .55, 'sine', .4); tone(f * 2, t + d, .25, 'sine', .08); });
  }
};

/* ============ IMAGE SWITCHING ============ */
const montage = $('montage'), fl = $('fl'), scan = $('scan'), bar = $('bar');
const S = {pulse: 0, flash: 0, prog: 0};
let cur = 0, timer = 0, raf = 0;

// Per-frame visual layer: zoom, rotation, shake, motion blur, flash, glitch bar.
function frame() {
  S.pulse *= .84; S.flash *= .8;
  const p = S.pulse;
  montage.style.transform = `translate3d(${rnd(-5, 5) * p}px,${rnd(-4, 4) * p}px,0) rotate(${rnd(-3, 3) * p}deg) scale(${1 + p * .07})`;
  montage.style.filter = p > .6 ? `blur(${(p * 1.3).toFixed(1)}px)` : 'none';
  fl.style.opacity = S.flash;
  scan.style.opacity = p > .5 && Math.random() < .5 ? .7 : 0;
  scan.style.transform = `translate3d(0,${rnd(0, 1300) | 0}%,0)`;
  bar.style.transform = `scaleX(${S.prog})`;
  raf = requestAnimationFrame(frame);
}
function show(n) {
  const i = n % IMGS;
  imgs[cur].classList.remove('on'); imgs[i].classList.add('on'); cur = i;
  S.pulse = i === 0 ? 1 : Math.max(S.pulse, .55);
  if (i === 0) S.flash = .24;
  S.prog = (n + 1) / TOTAL;
  sfx.blip(i);
}
function startMontage() {
  const t0 = performance.now(); let n = 0;
  raf = requestAnimationFrame(frame);
  (function tick() {
    show(n++);
    if (n >= TOTAL) { setTimeout(reveal, DELAY); return; }
    // drift-corrected timer: keeps ~10ms spacing without freezing the page
    timer = setTimeout(tick, Math.max(0, t0 + n * DELAY - performance.now()));
  })();
}

/* ============ FINAL REVEAL ============ */
async function reveal() {
  clearTimeout(timer); cancelAnimationFrame(raf);
  sfx.boom();
  $('flash').classList.add('pop');
  await wait(150);
  montage.style.display = 'none';
  const fin = $('final'); fin.classList.add('go');
  const r = fin.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 90);
  await wait(1500);
  burst(r.left + r.width / 2, r.top + r.height / 2, 40);
  await wait(700);
  notify('Wakkkk Thuuuu 🤮🤣', ['🤣', '🤮']);
  await wait(2800);
  await swapPic();
  await wait(1900);
  notify('Ummmmmmmmmmah 😘', ['💗', '😘']);
  await wait(2000);
  notify('jebin give me one pleaseee......', ['🥺', '💗']);
  ambient = false; document.body.classList.add('calm'); // stop everything that no longer needs to run
  await wait(3200);
  await openChat();
}

/* ============ NOTIFICATIONS (iPhone / Instagram style) ============ */
const box = $('notifs'); let nCount = 0;
const IG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="#fff"/></svg>';
function notify(msg, em) {
  const el = document.createElement('div'); el.className = 'nt';
  el.innerHTML = `<i class="ig">${IG}</i><div class="tx"><div class="hd"><b>Instagram</b><span>now</span></div><p></p></div>`;
  el.querySelector('p').textContent = msg;
  // FLIP: older notifications slide down smoothly when a new one drops in on top
  const old = [...box.children], y0 = old.map(e => e.getBoundingClientRect().top);
  box.prepend(el);
  old.forEach((e, i) => e.animate([{transform: `translateY(${y0[i] - e.getBoundingClientRect().top}px)`}, {transform: 'none'}], {duration: 500, easing: 'cubic-bezier(.2,.9,.3,1.1)'}));
  $('main').className = 'in n' + (++nCount);
  sfx.notif(); if (navigator.vibrate) navigator.vibrate([25, 40, 25]);
  burst(innerWidth / 2, 70, 22, em);
}
async function swapPic() {
  const a = $('final'), b = $('final2'), f = $('flash');
  a.classList.add('out'); await wait(550);
  a.style.display = 'none';
  f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
  sfx.boom(); b.classList.add('go');
  const r = b.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 60, ['💗', '✨', '💗']);
  await wait(1500);
}

/* ============ INSTAGRAM CHAT (auto-typed messages + Seen) ============ */
const MSGS = ['please jebin deo na ekta .', 'ekta e tow naki......', 'de na bal..........'];
async function openChat() {
  const inp = $('inp'), cmp = $('cmp'), msgs = $('msgs'), st = $('status');
  $('stamp').textContent = new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  box.firstElementChild.animate([{transform: 'scale(.96)'}, {transform: 'none'}], {duration: 220}); // "tap" the notification
  await wait(240);
  sfx.whoosh(); $('chat').classList.add('open');
  await wait(1700);
  for (const t of MSGS) {
    cmp.classList.add('typing');
    for (const ch of t) { inp.textContent += ch; await wait(rnd(45, 95)); }
    await wait(400);
    inp.textContent = ''; cmp.classList.remove('typing');
    const m = document.createElement('div'); m.className = 'm'; m.textContent = t; msgs.append(m);
    sfx.send(); st.textContent = 'Sent'; st.classList.add('on');
    await wait(1000); st.textContent = 'Seen';
    await wait(1200);
  }
}

/* ============ BACKGROUND SONG (first click/tap anywhere, no toggle) ============ */
const SONG = 'ssstik.io_1795864191574.mp3';  // same folder as index.html
const SONG_RAW = 'https://raw.githubusercontent.com/jellyquotex-eng/ara-chat/main/' + SONG;
const song = new Audio(SONG); song.loop = true; song.volume = .75; song.preload = 'auto';
song.addEventListener('error', () => { if (!song.src.startsWith('https://raw.')) song.src = SONG_RAW; });
const SONG_EVT = ['pointerup', 'keydown'];
function startSong() {
  song.play().then(() => SONG_EVT.forEach(t => removeEventListener(t, startSong, true))).catch(() => {}); // retries on next click if blocked
}
SONG_EVT.forEach(t => addEventListener(t, startSong, true));

/* ============ INTRO CLICK + TRANSITION ============ */
$('go').addEventListener('click', async e => {
  const btn = e.currentTarget; btn.disabled = true;
  initAudio(); sfx.whoosh();             // audio unlocked inside the click event
  const b = btn.getBoundingClientRect();
  burst(b.left + b.width / 2, b.top + b.height / 2, 70);
  $('intro').classList.add('out');
  await wait(800);
  $('intro').style.display = 'none';
  $('main').classList.add('in');
  await ready;                            // images are preloaded before the montage starts
  await wait(700);
  startMontage();
}, {once: true});
})();
